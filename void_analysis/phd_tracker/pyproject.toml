[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phd-tracker"
version = "0.1.0"
description = "Autonomous Academic Intelligence & PhD Application Pipeline: ArXiv literature mining, grant tracking, and PI outreach CRM."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Arun"}
]
keywords = ["phd", "astrophysics", "cosmology", "academic-tracker", "arxiv", "erc-grants", "application-pipeline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
phd-tracker = "phd_tracker.cli:main"
